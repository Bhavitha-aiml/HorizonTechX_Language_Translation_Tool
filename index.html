<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>AI Translation Tool</title>
    <link rel="stylesheet" href="styles.css?v=2" />
  </head>
  <body>
    <div class="app-shell">
      <header class="hero">
        <div>
          <p class="eyebrow">AI + NLP</p>
          <h1>Translation Studio</h1>
          <p class="subtitle">
            Translate text instantly with a polished, bilingual experience.
          </p>
        </div>
      </header>

      <main class="translator-card">
        <section class="panel input-panel">
          <div class="panel-header">
            <label for="sourceText">Source text</label>
            <button id="swapBtn" class="icon-btn" type="button">⇄</button>
          </div>
          <textarea id="sourceText" placeholder="Type or paste text to translate..."></textarea>

          <div class="controls-row">
            <select id="sourceLang">
              <option value="en">English</option>
              <option value="es">Spanish</option>
              <option value="fr">French</option>
              <option value="de">German</option>
              <option value="it">Italian</option>
              <option value="pt">Portuguese</option>
              <option value="ar">Arabic</option>
              <option value="hi">Hindi</option>
              <option value="ja">Japanese</option>
              <option value="ko">Korean</option>
              <option value="zh">Chinese</option>
              <option value="ru">Russian</option>
            </select>
            <button id="translateBtn" type="button">Translate</button>
            <button id="translateAllBtn" type="button" class="secondary-btn">Translate All</button>
            <select id="targetLang">
              <option value="en">English</option>
              <option value="es" selected>Spanish</option>
              <option value="fr">French</option>
              <option value="de">German</option>
              <option value="it">Italian</option>
              <option value="pt">Portuguese</option>
              <option value="ar">Arabic</option>
              <option value="hi">Hindi</option>
              <option value="ja">Japanese</option>
              <option value="ko">Korean</option>
              <option value="zh">Chinese</option>
              <option value="ru">Russian</option>
            </select>
          </div>
        </section>

        <section class="panel output-panel">
          <div class="panel-header">
            <label for="translatedText">Translation</label>
            <div class="actions">
              <button id="copyBtn" class="icon-btn" type="button">Copy</button>
              <button id="speakBtn" class="icon-btn" type="button">Speak</button>
            </div>
          </div>
          <textarea id="translatedText" readonly placeholder="Your translation will appear here..."></textarea>

          <div class="all-translations">
            <div class="panel-header small-header">
              <label>All translations</label>
            </div>
            <div id="allTranslationsList" class="translations-list"></div>
          </div>
        </section>
      </main>
    </div>

    <script src="script.js?v=2"></script>
  </body>
</html>
